name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  núcleo:
    name: núcleo Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ["3.11", "3.12"]
      # Só numpy: os testes do núcleo são stdlib + numpy e não tocam em Whisper,
      # Kokoro, Ollama nem ElevenLabs (requirements.txt é do app no PC, não do CI).
      - run: pip install numpy
      - run: python -m unittest discover -s tests -t . -v

  app:
    name: app (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      # tsc --noEmit + build: apanha o que os testes não apanham (tipos e empacotamento)
      - run: npm run build